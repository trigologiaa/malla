spring:
  application:
    name: malla-computacion
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/malla_computacion}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  docker:
    compose:
      enabled: false
logging:
  level:
    org.hibernate.SQL: debug
