spring:
  application:
    name: malla-computacion
  datasource:
    url: jdbc:mariadb://localhost:3306/malla_computacion
    username: tu_usuario
    password: "tu_contraseña"
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      show-sql: true
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MariaDBDialect
  logging:
    level:
      org.hibernate.SQL: debug
  docker:
    compose:
      enabled: false

